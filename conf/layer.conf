# Board layer for the "oddesey" STM32MP135D board.
# Only purpose for now: put mx/oddesey (CubeMX output) on BBPATH so that
# meta-st-stm32mp-addons' cubemx-stm32mp.bbclass can find CUBEMX_PROJECT = "mx/oddesey".
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "oddesey"
BBFILE_PATTERN_oddesey := "^${LAYERDIR}/"
BBFILE_PRIORITY_oddesey = "8"
BBFILE_PATTERN_IGNORE_EMPTY_oddesey = "1"

LAYERVERSION_oddesey = "1"
LAYERSERIES_COMPAT_oddesey = "scarthgap"
LAYERDEPENDS_oddesey = "stm-st-stm32mp-mx"
