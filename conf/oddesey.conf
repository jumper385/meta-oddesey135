# ODYSSEY-STM32MP135D board configuration (MACHINE = "stm32mp13-mx")
# Include from local.conf with:  require conf/oddesey.conf

# CubeMX project
CUBEMX_PROJECT        = "mx/oddesey"
CUBEMX_PROJECT_NAME   = "oddesey"
CUBEMX_DTB            = "stm32mp135d-oddesey-mx"
CUBEMX_BOARD_DDR_SIZE = "512"

# Boot
BOOTSCHEME_LABELS = "optee"
BOOTDEVICE_LABELS = "sdcard"

# Extra packages
IMAGE_INSTALL:append = " usb-gadget-acm"

# Boot time: release bootloaders, quiet kernel, no extlinux menu
ST_DEBUG_TRACE = "0"
UBOOT_EXTLINUX_SPLASH = ""
UBOOT_EXTLINUX_SPLASH:stm32mp13 = ""

IMAGE_INSTALL:append = " \
    python3 \
    python3-modules \
    python3-pip \
    python3-numpy \
    python3-dev \
    pkgconfig \
    libstdc++ \
    ca-certificates \
"

IMAGE_FEATURES:append = " tools-sdk ssh-server-openssh"

IMAGE_FEATURES += "ssh-server-openssh"
IMAGE_INSTALL:append = " openssh-sftp-server"

EXTRA_IMAGE_FEATURES += "allow-empty-password allow-root-login empty-root-password"

#INHERIT += "extrausers"
#EXTRA_USERS_PARAMS = "\
#    useradd -m -s /bin/sh chenry; \
#    usermod -p '\$6\$Bkm.3ih/HaXQ90nF\$jibJbdFjKaq9vOIzTzNNxxxPR1xzpd/zi4Ii6GJZJyvDoV.W37CmfA6OrgCNAu9Z4tNChHGOKzRJfO7cr6Uk4' chenry; \
#"

DISTRO_FEATURES:append = " rauc"
IMAGE_INSTALL:append = " rauc libubootenv-bin"

IMAGE_ROOTFS_SIZE:pn-core-image-minimal = "700000"
IMAGE_INSTALL:append = " e2fsprogs-resize2fs"

RAUC_KEY_FILE  = "${TOPDIR}/../openssl-ca/dev/private/development-1.key.pem"
RAUC_CERT_FILE = "${TOPDIR}/../openssl-ca/dev/development-1.cert.pem"
