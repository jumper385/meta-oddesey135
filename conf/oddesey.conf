# ODYSSEY-STM32MP135D board configuration (MACHINE = "stm32mp13-mx")
# Include from local.conf with:  require conf/oddesey.conf

# CubeMX project
CUBEMX_PROJECT        = "mx/oddesey"
CUBEMX_PROJECT_NAME   = "oddesey"
CUBEMX_DTB            = "stm32mp135d-oddesey-mx"
CUBEMX_BOARD_DDR_SIZE = "512"

# Boot
BOOTSCHEME_LABELS = "optee"
BOOTDEVICE_LABELS = "sdcard"

# Extra packages
IMAGE_INSTALL:append = " usb-gadget-acm"

# Boot time: release bootloaders, quiet kernel, no extlinux menu
ST_DEBUG_TRACE = "0"
UBOOT_EXTLINUX_SPLASH = ""
UBOOT_EXTLINUX_SPLASH:stm32mp13 = ""
